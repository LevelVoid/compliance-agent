name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No GPU, no network, no Temporal server: the model is behind LLMConfig.
      - run: python tests/smoke.py
      - name: audit the vulnerable tree
        run: MOCK_LLM=1 python audit.py run --path fixtures/bad --frameworks SOC2,HIPAA,GDPR
      - name: audit the remediated tree
        run: MOCK_LLM=1 python audit.py run --path fixtures/fixed --frameworks SOC2,HIPAA,GDPR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-reports
          path: out/report-*.md
